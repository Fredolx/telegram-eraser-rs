[package]
name = "telegram-eraser"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Fredolx/telegram-eraser-rs"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures-util = "0.3.34"
grammers-client = "0.12.0"
grammers-session = "0.12.0"
open = "5.4.5"
qrcode = { version = "0.15.0", default-features = false, features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui-input = "0.15.5"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
