name: Build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - uses: actions-rust-lang/rustfmt@v1
      - run: cargo clippy --locked

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            binary: telegram-eraser
          - os: windows-latest
            name: windows
            binary: telegram-eraser.exe
          - os: macos-latest
            name: macos
            binary: telegram-eraser
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo build --release --locked
      - uses: vimtor/action-zip@v1.3
        with:
          files: target/release/${{ matrix.binary }} LICENSE
          dest: telegram-eraser-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: telegram-eraser-${{ matrix.name }}
          path: telegram-eraser-${{ matrix.name }}.zip
